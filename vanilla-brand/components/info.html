<section class="info" id="info">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">Our Story</span>
      <h2>Rooted in Vanilla</h2>
    </div>

    <!-- A "page carousel": each .info-row is a full slide — clicking an
         arrow swaps to the next page. Every slide lives in its own file
         under components/info-pages/ and is pulled in here in order. -->
    <div class="carousel" data-carousel="info">
      <div class="carousel__track" data-info-track>
        <div data-include="components/info-pages/about.html"></div>
        <div data-include="components/info-pages/bakers.html"></div>
        <div data-include="components/info-pages/origin.html"></div>
      </div>
      <button class="carousel__arrow carousel__arrow--prev" aria-label="Previous slide">&#10094;</button>
      <button class="carousel__arrow carousel__arrow--next" aria-label="Next slide">&#10095;</button>
      <div class="carousel__dots"></div>
    </div>
  </div>
</section>
